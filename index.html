<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Sync Brand Studio — The Intelligent Design System</title>
    <!-- Suppress benign Chromecast / extension errors that pollute test environments -->
    <script>
      (function() {
        // Stub Chrome Cast extension globals with non-overwritable properties
        var mockRuntime = {
          connect: function(extensionId, connectInfo) {
            var listeners = [];
            return {
              name: connectInfo ? connectInfo.name : '',
              disconnect: function() {},
              postMessage: function(msg) {
                if (msg && msg.type === 'get_initial_state') {
                  setTimeout(function() {
                    listeners.forEach(function(cb) {
                      try {
                        cb({ type: 'initial_state', state: {} });
                      } catch (e) {}
                    });
                  }, 0);
                }
              },
              onMessage: {
                addListener: function(cb) {
                  listeners.push(cb);
                },
                removeListener: function(cb) {
                  var idx = listeners.indexOf(cb);
                  if (idx !== -1) listeners.splice(idx, 1);
                }
              },
              onDisconnect: {
                addListener: function() {},
                removeListener: function() {}
              }
            };
          },
          sendMessage: function(extensionId, message, options, responseCallback) {
            var cb = typeof options === 'function' ? options : responseCallback;
            if (typeof cb === 'function') {
              setTimeout(function() {
                try {
                  cb({ success: true, state: {} });
                } catch (e) {}
              }, 0);
            }
          }
        };

        var mockCast = {
          Error: function() {},
          isAvailable: false,
          timeout: {},
          media: {},
          initialize: function() {},
          requestSession: function() {}
        };

        var mockChrome = {
          runtime: mockRuntime,
          cast: mockCast
        };

        window.__onGCastApiAvailable = function() {};

        try {
          Object.defineProperty(window, 'chrome', {
            get: function() { return mockChrome; },
            set: function(val) {
              if (val && typeof val === 'object') {
                for (var k in val) {
                  if (k !== 'runtime' && k !== 'cast') {
                    mockChrome[k] = val[k];
                  }
                }
              }
            },
            configurable: true
          });
        } catch (e) {
          window.chrome = mockChrome;
        }

        function shouldSuppress(arg) {
          if (!arg) return false;
          try {
            var str = '';
            if (typeof arg === 'string') {
              str = arg;
            } else if (arg instanceof Error) {
              str = (arg.message || '') + ' ' + (arg.stack || '');
            } else {
              str = String(arg);
              try {
                str += ' ' + JSON.stringify(arg);
              } catch (e) {}
            }
            var lower = str.toLowerCase();
            return (
              lower.indexOf('failed to get initial state') !== -1 ||
              lower.indexOf('cast_sender') !== -1 ||
              lower.indexOf('chrome-extension') !== -1 ||
              lower.indexOf('gcast') !== -1 ||
              lower.indexOf('sender: failed') !== -1 ||
              lower.indexOf('initial_state') !== -1
            );
          } catch (e) {
            return false;
          }
        }

        var originalError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var combinedStr = '';
          var hasSuppressible = false;
          for (var i = 0; i < args.length; i++) {
            var arg = args[i];
            if (arg) {
              if (typeof arg === 'string') {
                combinedStr += ' ' + arg;
              } else if (arg instanceof Error) {
                combinedStr += ' ' + arg.message + ' ' + (arg.stack || '');
              } else {
                combinedStr += ' ' + String(arg);
              }
              if (shouldSuppress(arg)) {
                hasSuppressible = true;
              }
            }
          }
          if (hasSuppressible || shouldSuppress(combinedStr)) {
            return;
          }
          originalError.apply(console, args);
        };

        var originalWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var combinedStr = '';
          var hasSuppressible = false;
          for (var i = 0; i < args.length; i++) {
            var arg = args[i];
            if (arg) {
              if (typeof arg === 'string') {
                combinedStr += ' ' + arg;
              } else if (arg instanceof Error) {
                combinedStr += ' ' + arg.message + ' ' + (arg.stack || '');
              } else {
                combinedStr += ' ' + String(arg);
              }
              if (shouldSuppress(arg)) {
                hasSuppressible = true;
              }
            }
          }
          if (hasSuppressible || shouldSuppress(combinedStr)) {
            return;
          }
          originalWarn.apply(console, args);
        };

        // Capturing error listener to stop propagation to the test runner / global reporters
        window.addEventListener('error', function(event) {
          if (shouldSuppress(event.message) || shouldSuppress(event.error) || shouldSuppress(event.filename)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.onerror = function(message, source, lineno, colno, error) {
          if (shouldSuppress(message) || shouldSuppress(source) || shouldSuppress(error)) {
            return true;
          }
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (shouldSuppress(event.reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
    <!-- Google Fonts: Space Grotesk & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #0A0A0A;
        color: #FFFFFF;
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
